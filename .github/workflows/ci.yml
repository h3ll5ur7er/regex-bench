# Builds and tests everything on every push and pull request, and deploys main to GitHub Pages.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Rust toolchain with the WebAssembly target
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: core-${{ runner.os }}-${{ hashFiles('core/Cargo.lock') }}

      - name: Test the Rust core
        run: cargo test --manifest-path core/Cargo.toml

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build the Rust core to WebAssembly
        working-directory: web
        run: npm run build:core

      - name: Unit tests
        working-directory: web
        run: npm test

      - name: Build for GitHub Pages
        working-directory: web
        # Pages serves the site under /<repository>/.
        run: npx ng build --base-href "/${{ github.event.repository.name }}/"

      - name: End-to-end checks (no external requests, engines, sandbox, sharing, offline)
        working-directory: web
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node scripts/e2e.mjs dist/web/browser "/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: web/dist/web/browser

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
