[package]
name = "regex-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust regex engine for regex-bench, as a plain C-ABI WebAssembly module"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
