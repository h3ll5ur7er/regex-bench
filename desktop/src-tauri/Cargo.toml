[package]
name = "regex-bench-desktop"
version = "0.1.0"
description = "regex-bench desktop app: the same on-device regex workbench, as a native window"
edition = "2021"
license = "MIT"

[lib]
name = "regex_bench_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
